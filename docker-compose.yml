services:
  nginx:
    # Тег для людей, digest — чтобы тег нельзя было тихо подменить.
    image: nginx:1.31.6-alpine3.24@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # Master остаётся root, чтобы прочитать privkey.pem (0600 root) и занять 80/443.
    # Запросы обслуживают воркеры от пользователя nginx.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    # На сервере образ только скачивается: точный digest задаёт
    # docker-compose.override.yml, его пишет .github/scripts/deploy.sh. Тег main здесь —
    # запасной вариант, если override ещё нет. Локально образ собирается
    # из исходников (build в docker-compose.local.yml).
    image: ghcr.io/koppao/aboutme-api:main
    env_file:
      - .env
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      TRUST_PROXY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./content:/app/content:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Мажор 16 менять только через pg_upgrade: данные лежат в pgdata.
    # Debian, не alpine: другая libc меняет сортировку строк и ломает индексы.
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    # Только свои три переменные, а не весь .env: SESSION_SECRET и хэш пароля
    # админа базе ни к чему. Значения подставляются из того же .env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
