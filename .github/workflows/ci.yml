# Проверки. На pull request файл запускается сам.
# Перед выкладкой его вызывает cd.yml через workflow_call.

name: ci

on:
  pull_request:
  workflow_call:

# Права по умолчанию минимальные, каждый job просит своё сам.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # кэш слоёв Docker в GitHub Actions (type=gha)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image and run tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # кэш слоёв Docker в GitHub Actions (type=gha)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: aboutme:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aboutme:${{ github.sha }}
          format: json
          output: trivy-report.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Publish Trivy findings
        if: always()
        env:
          IMAGE_REF: aboutme:${{ github.sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def cell(value):
              return str(value or "").replace("|", "\\|").replace("\n", " ")

          image = os.environ.get("IMAGE_REF", "")
          data = json.loads(Path("trivy-report.json").read_text(encoding="utf-8"))
          rows = []
          for result in data.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  rows.append(
                      {
                          "severity": vuln.get("Severity") or "",
                          "pkg": vuln.get("PkgName") or "",
                          "installed": vuln.get("InstalledVersion") or "",
                          "fixed": vuln.get("FixedVersion") or "-",
                          "cve": vuln.get("VulnerabilityID") or "",
                          "title": vuln.get("Title") or "",
                      }
                  )

          rows.sort(
              key=lambda row: (
                  {"CRITICAL": 0, "HIGH": 1}.get(row["severity"], 9),
                  row["pkg"],
                  row["cve"],
              )
          )
          counts = {"CRITICAL": 0, "HIGH": 0}
          for row in rows:
              if row["severity"] in counts:
                  counts[row["severity"]] += 1

          if rows:
              summary = "{} CRITICAL, {} HIGH (fix available)".format(
                  counts["CRITICAL"], counts["HIGH"]
              )
          else:
              summary = "No HIGH/CRITICAL findings."

          md = [
              "## Trivy image scan",
              "",
              "Image: `{}`".format(image),
              "",
              summary,
              "",
          ]
          if rows:
              md += [
                  "| Severity | Package | Installed | Fixed | ID | Title |",
                  "| --- | --- | --- | --- | --- | --- |",
              ]
              for row in rows:
                  md.append(
                      "| {} | {} | {} | {} | {} | {} |".format(
                          cell(row["severity"]),
                          cell(row["pkg"]),
                          cell(row["installed"]),
                          cell(row["fixed"]),
                          cell(row["cve"]),
                          cell(row["title"]),
                      )
                  )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(md) + "\n", encoding="utf-8"
          )

          for row in rows:
              message = "{} {} {} -> {}".format(
                  row["cve"], row["pkg"], row["installed"], row["fixed"]
              )
              if row["severity"] == "CRITICAL":
                  print("::error title=Trivy CRITICAL::{}".format(message))
              elif row["severity"] == "HIGH":
                  print("::warning title=Trivy HIGH::{}".format(message))

          print(summary)
          sys.exit(1 if counts["CRITICAL"] else 0)
          PY
