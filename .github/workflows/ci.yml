# Этот файл описывает, ЧТО GitHub делает с кодом. Сами секреты сюда не пишем.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aboutme:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aboutme:${{ github.sha }}
          format: json
          output: trivy-report.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Show findings and fail on HIGH/CRITICAL
        run: |
          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("trivy-report.json").read_text(encoding="utf-8"))
          rows = []
          for result in data.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  rows.append(
                      (
                          vuln.get("Severity") or "",
                          vuln.get("PkgName") or "",
                          vuln.get("InstalledVersion") or "",
                          vuln.get("FixedVersion") or "-",
                          vuln.get("VulnerabilityID") or "",
                      )
                  )

          header = "{:<10} {:<28} {:<18} {:<18} {}".format(
              "SEV", "PACKAGE", "INSTALLED", "FIXED", "ID"
          )
          if rows:
              body = "\n".join(
                  "{:<10} {:<28} {:<18} {:<18} {}".format(*row) for row in rows
              )
              text = "{}\n{}\n\n{} finding(s) with a fix available.".format(
                  header, body, len(rows)
              )
          else:
              text = "No HIGH/CRITICAL findings."
          Path("trivy-report.txt").write_text(text + "\n", encoding="utf-8")
          print(text)
          sys.exit(1 if rows else 0)
          PY

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-report.txt
          retention-days: 30
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, gitleaks, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/app/aboutme
            git fetch origin
            git checkout main
            git pull origin main
            docker compose up -d --build
            docker compose ps
