# Проверки и образ api. На pull request файл запускается сам.
# Перед выкладкой его вызывает cd.yml через workflow_call: тогда проверенный
# образ публикуется в GHCR, а его digest уходит в cd.yml.

name: ci

on:
  pull_request:
  workflow_call:
    outputs:
      image:
        description: Опубликованный образ api с digest, пусто на pull request
        value: ${{ jobs.image.outputs.image }}

# Права по умолчанию минимальные, каждый job просит своё сам.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Один образ на всё: на нём идут тесты, его сканирует Trivy, и ровно он
  # уходит в GHCR и на сервер. Раньше образ собирался в CI дважды и ещё раз на VPS.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # кэш слоёв Docker в GitHub Actions (type=gha)
      packages: write # push в ghcr.io, только на main
      id-token: write # подпись аттестаций, только на main
      attestations: write # аттестации provenance и SBOM, только на main
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: aboutme-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aboutme-api:scan
          format: json
          output: trivy-report.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Publish Trivy findings
        if: always()
        env:
          IMAGE_REF: aboutme-api:scan
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def cell(value):
              return str(value or "").replace("|", "\\|").replace("\n", " ")

          image = os.environ.get("IMAGE_REF", "")
          data = json.loads(Path("trivy-report.json").read_text(encoding="utf-8"))
          rows = []
          for result in data.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  rows.append(
                      {
                          "severity": vuln.get("Severity") or "",
                          "pkg": vuln.get("PkgName") or "",
                          "installed": vuln.get("InstalledVersion") or "",
                          "fixed": vuln.get("FixedVersion") or "-",
                          "cve": vuln.get("VulnerabilityID") or "",
                          "title": vuln.get("Title") or "",
                      }
                  )

          rows.sort(
              key=lambda row: (
                  {"CRITICAL": 0, "HIGH": 1}.get(row["severity"], 9),
                  row["pkg"],
                  row["cve"],
              )
          )
          counts = {"CRITICAL": 0, "HIGH": 0}
          for row in rows:
              if row["severity"] in counts:
                  counts[row["severity"]] += 1

          if rows:
              summary = "{} CRITICAL, {} HIGH (fix available)".format(
                  counts["CRITICAL"], counts["HIGH"]
              )
          else:
              summary = "No HIGH/CRITICAL findings."

          md = [
              "## Trivy image scan",
              "",
              "Image: `{}`".format(image),
              "",
              summary,
              "",
          ]
          if rows:
              md += [
                  "| Severity | Package | Installed | Fixed | ID | Title |",
                  "| --- | --- | --- | --- | --- | --- |",
              ]
              for row in rows:
                  md.append(
                      "| {} | {} | {} | {} | {} | {} |".format(
                          cell(row["severity"]),
                          cell(row["pkg"]),
                          cell(row["installed"]),
                          cell(row["fixed"]),
                          cell(row["cve"]),
                          cell(row["title"]),
                      )
                  )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(md) + "\n", encoding="utf-8"
          )

          for row in rows:
              message = "{} {} {} -> {}".format(
                  row["cve"], row["pkg"], row["installed"], row["fixed"]
              )
              if row["severity"] == "CRITICAL":
                  print("::error title=Trivy CRITICAL::{}".format(message))
              elif row["severity"] == "HIGH":
                  print("::warning title=Trivy HIGH::{}".format(message))

          print(summary)
          sys.exit(1 if counts["CRITICAL"] else 0)
          PY

      # Дальше только на main. Если Trivy нашёл CRITICAL, шаг выше упал
      # и сюда дело не дойдёт: непроверенный образ не публикуется.
      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aboutme-api:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Пушится тот самый просканированный образ, а не пересобранный.
      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/aboutme-api"
          docker tag aboutme-api:scan "$repo:sha-$GITHUB_SHA"
          docker tag aboutme-api:scan "$repo:main"
          docker push "$repo:sha-$GITHUB_SHA"
          docker push "$repo:main"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:sha-$GITHUB_SHA")"
          case "$ref" in
            "$repo@sha256:"*) ;;
            *) echo "unexpected digest: $ref" >&2; exit 1 ;;
          esac
          echo "name=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "Published $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
