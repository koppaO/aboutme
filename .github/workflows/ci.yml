# .github/workflows/ci.yml
# Этот файл описывает, ЧТО GitHub делает с кодом. Сами секреты сюда не пишем.

name: ci


on:
  pull_request:
  push:
    branches:
      - main


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Check out repository
        uses: actions/checkout@v4

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      
      - name: Install dependencies
        run: pip install -r requirements.txt

      
      - name: Run tests
        run: pytest

      
      - name: Build API image
        run: docker build -t aboutme-api .