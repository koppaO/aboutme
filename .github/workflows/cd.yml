# Выкладка на VPS только после тех же проверок, что и на pull request.
# ci.yml собирает и проверяет образ api и публикует его в GHCR. Сюда приходит
# его digest, и сервер скачивает ровно этот образ, ничего не собирая сам.
# Сама выкладка с проверкой и откатом — deploy/deploy.sh.
# content/*.json в уже заполненную Postgres не перечитывается, рестарт api это не меняет.

name: cd

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  checks:
    # Вызываемый ci.yml получает не больше прав, чем выдано здесь.
    permissions:
      contents: read # checkout
      actions: write # кэш слоёв Docker
      packages: write # push образа в ghcr.io
      id-token: write # подпись аттестаций
      attestations: write # аттестации provenance и SBOM
    uses: $/.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # Секреты SSH живут только в этом environment, а он доступен только ветке main.
    environment:
      name: production
      url: https://koppa0.dev
    permissions: {}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.checks.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Ключ хоста проверяется: подменённый сервер деплой не получит.
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 20m
          envs: DEPLOY_SHA,API_IMAGE
          script: |
            set -euo pipefail
            if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "bad sha" >&2
              exit 1
            fi
            cd ~/app/aboutme
            prev_sha="$(git rev-parse HEAD)"
            git fetch origin main
            git checkout -f -B main "$DEPLOY_SHA"
            echo "checked out $DEPLOY_SHA (was $prev_sha)"
            # Копия скрипта: при откате git checkout может поменять файл в рабочей копии.
            runner="$(mktemp)"
            trap 'rm -f "$runner"' EXIT
            cp deploy/deploy.sh "$runner"
            bash "$runner" "$API_IMAGE" "$prev_sha"

      # Ещё одна проверка снаружи: DNS, сертификат и nginx глазами посетителя.
      - name: Check the live site
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if body="$(curl -fsS --max-time 10 https://koppa0.dev/api/health)" &&
              [[ "$body" == *'"status":"ok"'* ]] &&
              curl -fsS --max-time 10 -o /dev/null https://koppa0.dev/; then
              echo "live site ok"
              exit 0
            fi
            sleep 6
          done
          echo "koppa0.dev does not answer after deploy" >&2
          exit 1
