services:
  api:
    # Локально образ собирается из исходников, а не скачивается из GHCR.
    image: aboutme-api:local
    build: .

  nginx:
    ports: !override
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
