<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title data-i18n="login.title">Вход</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
    <script src="/i18n.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip">К содержимому</a>
    <header class="masthead">
      <a class="brand" href="/">koppaO</a>
      <nav class="nav" aria-label="Разделы" data-i18n-aria-label="nav.label">
        <a href="/#about-section" data-i18n="nav.about">О себе</a>
        <a href="/#projects-section" data-i18n="nav.projects">Проекты</a>
        <a href="/clips.html" data-i18n="nav.clips">Клипы</a>
      </nav>
      <div class="controls">
        <div class="lang" role="group" aria-label="Язык" data-i18n-aria-label="lang.label">
          <button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Тёмная тема" data-i18n-title="theme.dark">
          <span class="swatch" aria-hidden="true"></span>
          <span class="theme-label" data-i18n="theme.dark">Тёмная тема</span>
        </button>
      </div>
    </header>

    <main class="page" id="main">
      <section class="hero is-short" aria-labelledby="login-title">
        <h1 id="login-title" data-i18n="login.title">Вход</h1>
        <p class="hero-sub" data-i18n="login.headline">Служебный вход для владельца сайта.</p>
      </section>
      <section class="row" aria-labelledby="login-form-title">
        <h2 id="login-form-title" class="row-title" data-i18n="login.formTitle">Аккаунт</h2>
        <div class="row-body">
          <p id="status" class="status" role="alert" hidden></p>
          <form id="login-form" class="gate-form">
            <label>
              <span data-i18n="login.login">Логин</span>
              <input id="login" name="login" autocomplete="username" maxlength="32" required />
            </label>
            <label>
              <span data-i18n="login.password">Пароль</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="256"
                required
              />
            </label>
            <button type="submit" data-i18n="login.submit">Войти</button>
          </form>
        </div>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
