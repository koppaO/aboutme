<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Вход</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="is-loading">
    <div class="scene" aria-hidden="true">
      <div class="sky"></div>
      <div class="sun"></div>
      <div class="haze"></div>
      <div class="field"></div>
      <svg class="tree" viewBox="0 0 400 900" preserveAspectRatio="xMaxYMax meet">
        <ellipse cx="310" cy="90" rx="140" ry="90" fill="#0b0f0a" />
        <ellipse cx="210" cy="150" rx="120" ry="80" fill="#10160e" />
        <ellipse cx="360" cy="170" rx="90" ry="70" fill="#0a0d09" />
        <ellipse cx="280" cy="230" rx="160" ry="100" fill="#121810" />
        <path d="M292 240 C300 420 286 640 278 900 L318 900 C322 640 336 410 328 240 Z" fill="#0c100b" />
      </svg>
      <div class="grain"></div>
    </div>

    <main class="page">
      <nav class="site-nav" aria-label="Разделы">
        <a href="/">О себе</a>
      </nav>
      <header class="hero">
        <h1>Вход</h1>
        <p id="headline">Личные приложения. Публичного меню здесь нет.</p>
      </header>
      <p id="status" hidden></p>
      <form id="login-form" class="gate-form">
        <label>
          Логин
          <input id="login" name="login" autocomplete="username" maxlength="32" required />
        </label>
        <label>
          Пароль
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          />
        </label>
        <button type="submit">Войти</button>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
