<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aboutme</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="is-loading">
    <div class="scene" aria-hidden="true">
      <div class="sky"></div>
      <div class="sun"></div>
      <div class="haze"></div>
      <div class="field"></div>
      <svg class="tree" viewBox="0 0 400 900" preserveAspectRatio="xMaxYMax meet">
        <ellipse cx="310" cy="90" rx="140" ry="90" fill="#0b0f0a" />
        <ellipse cx="210" cy="150" rx="120" ry="80" fill="#10160e" />
        <ellipse cx="360" cy="170" rx="90" ry="70" fill="#0a0d09" />
        <ellipse cx="280" cy="230" rx="160" ry="100" fill="#121810" />
        <path d="M292 240 C300 420 286 640 278 900 L318 900 C322 640 336 410 328 240 Z" fill="#0c100b" />
      </svg>
      <div class="grain"></div>
    </div>

    <main class="page">
      <p id="status" hidden></p>
      <p id="health" class="health">проверяю сервисы…</p>
      <header class="hero">
        <h1 id="name"></h1>
        <p id="headline"></p>
        <nav id="socials"></nav>
      </header>
      <section id="about-section" hidden>
        <h2>О себе</h2>
        <p id="about"></p>
      </section>
      <section id="projects-section" hidden>
        <h2>Проекты</h2>
        <ul id="projects"></ul>
      </section>
      <footer>
        <p>Сайт с собственного API · nginx + FastAPI</p>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
