<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>koppaO</title>
    <link rel="preload" href="/vendor/fonts/mona-sans-2.0.27/MonaSansVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
    <script src="/i18n.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-inert-with-terminal data-i18n="skip">К содержимому</a>
    <div class="preloader" id="preloader" role="status" aria-live="polite" data-i18n="loading">загрузка</div>

    <header class="masthead">
      <a class="brand" href="/" data-inert-with-terminal>koppaO</a>
      <nav class="nav" aria-label="Разделы" data-i18n-aria-label="nav.label" data-inert-with-terminal>
        <a href="#about-section" data-i18n="nav.about">О себе</a>
        <a href="#projects-section" data-i18n="nav.projects">Проекты</a>
        <a href="/clips.html" data-i18n="nav.clips">Клипы</a>
      </nav>
      <div class="controls">
        <div class="lang" role="group" aria-label="Язык" data-i18n-aria-label="lang.label" data-inert-with-terminal>
          <button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" data-inert-with-terminal title="Тёмная тема" data-i18n-title="theme.dark">
          <span class="swatch" aria-hidden="true"></span>
          <span class="theme-label" data-i18n="theme.dark">Тёмная тема</span>
        </button>
        <button
          type="button"
          id="menu-btn"
          class="term-btn"
          aria-expanded="false"
          aria-controls="terminal"
          aria-haspopup="dialog"
          data-i18n="term.open"
        >
          / терминал
        </button>
      </div>
    </header>

    <main class="page" id="main" data-inert-with-terminal>
      <section class="hero" id="hero" aria-labelledby="name">
        <p id="status" class="status" role="alert" hidden></p>
        <h1 id="name">koppaO</h1>
        <p id="headline" class="hero-sub"></p>
      </section>

      <section id="about-section" class="row" aria-labelledby="about-title" hidden>
        <h2 id="about-title" class="row-title" data-i18n="section.about">О себе</h2>
        <div class="row-body split" id="about-body">
          <div id="about-text">
            <p id="about" class="prose"></p>
            <ul id="socials" class="socials"></ul>
          </div>
          <div id="player" class="player" hidden>
            <h3 id="player-title" data-i18n="section.playing">Сейчас играет</h3>
          </div>
        </div>
      </section>

      <section id="timeline-section" class="row" aria-labelledby="timeline-title" hidden>
        <h2 id="timeline-title" class="row-title" data-i18n="section.timeline">Таймлайн</h2>
        <div class="row-body">
          <ol id="timeline" class="timeline"></ol>
        </div>
      </section>

      <section id="skills-section" class="row" aria-labelledby="skills-title" hidden>
        <h2 id="skills-title" class="row-title" data-i18n="section.stack">Стек</h2>
        <div class="row-body">
          <div
            id="skill-filter"
            class="skill-filter"
            role="group"
            aria-label="Категории стека"
            data-i18n-aria-label="skills.filter"
            hidden
          ></div>
          <ul id="skills-static" class="chips"></ul>
          <div id="skills-world" class="skills-world" hidden aria-hidden="true"></div>
        </div>
      </section>

      <section id="projects-section" class="row" aria-labelledby="projects-title" hidden>
        <h2 id="projects-title" class="row-title" data-i18n="section.projects">Проекты</h2>
        <div class="row-body work">
          <ul id="project-index" class="project-index"></ul>
          <div id="project-preview" class="preview"></div>
        </div>
        <div
          id="project-strip"
          class="strip"
          tabindex="0"
          role="region"
          aria-label="Лента проектов"
          data-i18n-aria-label="projects.strip"
        ></div>
      </section>
    </main>

    <footer class="site-foot" data-inert-with-terminal>
      <p data-i18n="footer.built">Сайт работает на своём API: nginx и FastAPI.</p>
      <p class="key-hint" data-i18n="footer.hint">Нажми /, чтобы открыть терминал.</p>
    </footer>

    <div
      id="terminal"
      class="terminal"
      role="dialog"
      aria-modal="true"
      aria-label="Терминал"
      data-i18n-aria-label="term.label"
      hidden
    >
      <p class="terminal-hint" id="terminal-hint" data-i18n="term.hint">Tab — дополнить, ↑↓ — история, Esc — закрыть</p>
      <div id="terminal-log" class="terminal-log" role="log" aria-live="polite" tabindex="-1"></div>
      <form id="terminal-form" class="terminal-form">
        <label for="terminal-input" aria-hidden="true">&gt;</label>
        <input
          id="terminal-input"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Команда"
          aria-describedby="terminal-hint"
          data-i18n-aria-label="term.input"
          maxlength="40"
        />
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
