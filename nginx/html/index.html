<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aboutme</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div class="preloader" id="preloader" role="status" aria-live="polite">загрузка</div>
    <div class="scene" aria-hidden="true">
      <div class="sky"></div>
      <div class="sun"></div>
      <div class="haze"></div>
      <div class="field"></div>
      <svg class="tree" viewBox="0 0 400 900" preserveAspectRatio="xMaxYMax meet">
        <ellipse cx="310" cy="90" rx="140" ry="90" fill="#0b0f0a" />
        <ellipse cx="210" cy="150" rx="120" ry="80" fill="#10160e" />
        <ellipse cx="360" cy="170" rx="90" ry="70" fill="#0a0d09" />
        <ellipse cx="280" cy="230" rx="160" ry="100" fill="#121810" />
        <path d="M292 240 C300 420 286 640 278 900 L318 900 C322 640 336 410 328 240 Z" fill="#0c100b" />
      </svg>
      <div class="grain"></div>
    </div>

    <header class="topbar">
      <nav class="topbar-nav" id="top-nav" aria-label="Разделы">
        <a href="/" aria-current="page">О себе</a>
        <a href="/clips.html">Клипы</a>
      </nav>
      <button
        type="button"
        id="menu-btn"
        class="menu-btn"
        aria-expanded="false"
        aria-controls="terminal"
        aria-haspopup="dialog"
      >
        Menu
      </button>
    </header>

    <main class="story" id="story">
      <canvas id="glyphs" class="glyphs" aria-hidden="true" hidden></canvas>
      <section class="hero" id="hero">
        <p id="status" class="status" hidden></p>
        <h1 id="name" class="glitch" data-text=""></h1>
        <p id="headline"></p>
      </section>

      <section id="about-section" class="panel reveal" hidden>
        <h2>О себе</h2>
        <p id="about"></p>
        <nav id="socials"></nav>
      </section>

      <section id="skills-section" class="panel reveal" hidden>
        <h2>Стек</h2>
        <div id="skills-static" class="chips"></div>
        <div id="skills-world" class="skills-world" hidden aria-hidden="true"></div>
      </section>

      <section id="projects-section" class="panel reveal" hidden>
        <h2>Проекты</h2>
        <div class="work">
          <ul id="project-index" class="project-index"></ul>
          <div id="project-preview" class="preview"></div>
        </div>
        <div id="project-strip" class="strip" tabindex="0" aria-label="Лента проектов"></div>
      </section>

      <footer>
        <p>Сайт с собственного API · nginx + FastAPI</p>
      </footer>
    </main>

    <div id="terminal" class="terminal" role="dialog" aria-modal="true" aria-label="Терминал" hidden>
      <p class="terminal-hint">Tab — дополнить · ↑↓ — история · Esc — закрыть</p>
      <div id="terminal-log" class="terminal-log" role="log" aria-live="polite"></div>
      <form id="terminal-form" class="terminal-form">
        <label for="terminal-input">&gt;</label>
        <input id="terminal-input" autocomplete="off" spellcheck="false" aria-label="Команда" maxlength="40" />
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
