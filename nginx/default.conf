gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

upstream api_upstream {
    server api:8080;
    keepalive 16;
}

server_tokens off;
tcp_nopush on;
tcp_nodelay on;
open_file_cache max=64 inactive=60s;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name koppa0.dev www.koppa0.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://koppa0.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000" always;

    return 301 https://koppa0.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 256k;

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        access_log off;
    }
}

server {
    listen 443 ssl;
    server_name wg.koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:51821;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}
