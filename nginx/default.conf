map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name koppa0.dev www.koppa0.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://koppa0.dev$request_uri;
    }
}

server {
    listen 80;
    server_name money.koppa0.dev travel.koppa0.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://koppa0.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name money.koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    large_client_header_buffers 4 32k;

    add_header X-Robots-Tag "noindex" always;

    location = /authz-check {
        internal;
        proxy_method GET;
        proxy_pass http://api:8080/authz;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_set_header Cookie "session=$cookie_session";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @gate_login {
        return 302 https://koppa0.dev/login.html?next=$scheme://$host$request_uri;
    }

    location @gate_forbidden {
        return 302 https://koppa0.dev/apps.html;
    }

    location / {
        auth_request /authz-check;
        error_page 401 = @gate_login;
        error_page 403 = @gate_forbidden;
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        proxy_pass http://aurum-web:80;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name travel.koppa0.dev;

    ssl_certificate     /etc/letsencrypt/live/koppa0.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koppa0.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    large_client_header_buffers 4 32k;

    add_header X-Robots-Tag "noindex" always;

    location = /authz-check {
        internal;
        proxy_method GET;
        proxy_pass http://api:8080/authz;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_set_header Cookie "session=$cookie_session";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @gate_login {
        return 302 https://koppa0.dev/login.html?next=$scheme://$host$request_uri;
    }

    location @gate_forbidden {
        return 302 https://koppa0.dev/apps.html;
    }

    location / {
        auth_request /authz-check;
        error_page 401 = @gate_login;
        error_page 403 = @gate_forbidden;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
        proxy_pass http://adventurelog:80;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_set_header X-Requested-With $http_x_requested_with;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
